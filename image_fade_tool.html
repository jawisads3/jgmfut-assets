<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGM Image Fade</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');
:root {
  --bg:#0a0a0f; --surface:#12121a; --surface2:#1a1a26;
  --border:#2a2a40; --accent:#7b5cf0; --accent2:#a78bfa;
  --green:#4ade80; --text:#e2e8f0; --muted:#64748b;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;padding:20px 16px 40px;}
header{text-align:center;margin-bottom:24px;padding-top:8px;}
header h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent2),#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
header p{font-size:13px;color:var(--muted);margin-top:4px;font-family:'Space Mono',monospace;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;}
.lbl{font-size:12px;font-weight:700;color:var(--accent2);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;display:block;}

/* file input nativo visible */
#fileInput{display:block;width:100%;padding:14px;background:var(--surface2);border:2px dashed var(--border);border-radius:12px;color:var(--muted);font-family:'Space Mono',monospace;font-size:13px;cursor:pointer;}

.color-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sw{width:36px;height:36px;border-radius:8px;border:2px solid var(--border);cursor:pointer;flex-shrink:0;transition:border-color .15s;}
.sw.active{border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent);}
.cw{display:flex;flex-direction:column;align-items:center;gap:3px;}
.cw input[type=color]{width:36px;height:36px;border:2px solid var(--border);border-radius:8px;cursor:pointer;padding:2px;background:var(--surface2);}
.cw span{font-size:10px;color:var(--muted);font-family:'Space Mono',monospace;}

.hex-row{display:flex;align-items:center;gap:10px;margin-top:12px;}
#hexPreview{width:36px;height:36px;border-radius:8px;background:#000;border:2px solid var(--border);flex-shrink:0;}
#hexInput{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-family:'Space Mono',monospace;font-size:15px;outline:none;}
#hexInput:focus{border-color:var(--accent);}
.hex-tag{font-size:11px;color:var(--muted);font-family:'Space Mono',monospace;}

.ctrl-row{display:flex;align-items:center;gap:12px;margin-top:14px;}
.ctrl-lbl{font-size:12px;color:var(--muted);font-family:'Space Mono',monospace;min-width:80px;}
.ctrl-val{font-size:12px;color:var(--accent2);font-family:'Space Mono',monospace;min-width:38px;text-align:right;}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:var(--border);border-radius:2px;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;background:var(--accent);border-radius:50%;cursor:pointer;}
input[type=range]::-moz-range-thumb{width:22px;height:22px;background:var(--accent);border-radius:50%;border:none;cursor:pointer;}

.canvas-wrap{position:relative;border-radius:12px;overflow:hidden;background:#111;border:1px solid var(--border);}
.canvas-wrap canvas{display:block;width:100%;height:auto;pointer-events:none;}

.drag-handle{position:absolute;left:0;right:0;height:44px;margin-top:-22px;cursor:ns-resize;touch-action:none;display:flex;align-items:center;justify-content:center;z-index:10;}
.hline{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1px;pointer-events:none;}
.hpill{font-size:11px;font-family:'Space Mono',monospace;font-weight:700;padding:4px 12px;border-radius:20px;white-space:nowrap;pointer-events:none;color:white;position:relative;z-index:1;}
#hS .hline{background:rgba(167,139,250,.9);}
#hS .hpill{background:var(--accent);}
#hE .hline{background:rgba(74,222,128,.9);}
#hE .hpill{background:#16a34a;}

.legend{display:flex;gap:16px;margin-top:10px;justify-content:center;flex-wrap:wrap;}
.li{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-family:'Space Mono',monospace;}
.ld{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

.dl-btn{width:100%;background:var(--accent);color:white;border:none;border-radius:12px;padding:16px;font-family:'Syne',sans-serif;font-size:16px;font-weight:700;cursor:pointer;margin-top:14px;-webkit-tap-highlight-color:transparent;}
.dl-btn:active{opacity:.85;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--green);color:#0a0a0f;padding:12px 24px;border-radius:100px;font-weight:700;font-size:14px;font-family:'Syne',sans-serif;transition:transform .3s;z-index:999;white-space:nowrap;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <h1>JGM Image Fade</h1>
  <p>NEW</p>
</header>

<div class="card">
  <span class="lbl">Imagen</span>
  <input type="file" id="fileInput" accept="image/*">
</div>

<div class="card" id="ctrlCard" style="display:none;">
  <span class="lbl">Color del fade</span>
  <div class="color-row">
    <div class="sw active" style="background:#000000" data-c="#000000" onclick="pickSw(this)"></div>
    <div class="sw" style="background:#ffffff" data-c="#ffffff" onclick="pickSw(this)"></div>
    <div class="sw" style="background:#1a1a2e" data-c="#1a1a2e" onclick="pickSw(this)"></div>
    <div class="sw" style="background:#2b2b2b" data-c="#2b2b2b" onclick="pickSw(this)"></div>
    <div class="sw" style="background:#3d1a00" data-c="#3d1a00" onclick="pickSw(this)"></div>
    <div class="sw" style="background:#001a3d" data-c="#001a3d" onclick="pickSw(this)"></div>
    <div class="cw">
      <input type="color" id="colorPicker" value="#000000" oninput="pickColor(this.value)">
      <span>custom</span>
    </div>
  </div>
  <div class="hex-row">
    <div id="hexPreview"></div>
    <input type="text" id="hexInput" value="#000000" maxlength="7" placeholder="#000000" oninput="onHex(this.value)" onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
    <span class="hex-tag">hex</span>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-lbl">Opacidad</span>
    <input type="range" id="opSlider" min="0" max="100" value="100" oninput="render();document.getElementById('opVal').textContent=this.value+'%'">
    <span class="ctrl-val" id="opVal">100%</span>
  </div>
</div>

<div class="card" id="prevCard" style="display:none;">
  <span class="lbl">Vista previa — arrastra las líneas</span>
  <div class="canvas-wrap" id="cWrap">
    <canvas id="cv"></canvas>
    <div class="drag-handle" id="hS" style="top:60%">
      <div class="hline"></div>
      <div class="hpill">↕ inicio fade</div>
    </div>
    <div class="drag-handle" id="hE" style="top:85%">
      <div class="hline"></div>
      <div class="hpill">↕ fin fade</div>
    </div>
  </div>
  <div class="legend">
    <div class="li"><div class="ld" style="background:var(--accent)"></div>morado = inicio</div>
    <div class="li"><div class="ld" style="background:#16a34a"></div>verde = fin (opaco)</div>
  </div>
  <button class="dl-btn" onclick="dl()">⬇ Descargar PNG</button>
</div>

<div class="toast" id="toast">Descargado!</div>

<script>
var img=null, color='#000000', sP=0.60, eP=0.85, active=null;

document.getElementById('fileInput').onchange=function(){
  if(this.files&&this.files[0]) load(this.files[0]);
};

function load(f){
  var r=new FileReader();
  r.onload=function(e){
    var i=new Image();
    i.onload=function(){
      img=i;
      document.getElementById('ctrlCard').style.display='block';
      document.getElementById('prevCard').style.display='block';
      render();
    };
    i.src=e.target.result;
  };
  r.readAsDataURL(f);
}

function setColor(c){
  color=c;
  document.getElementById('colorPicker').value=c;
  document.getElementById('hexInput').value=c;
  document.getElementById('hexPreview').style.background=c;
}
function pickSw(el){
  document.querySelectorAll('.sw').forEach(function(s){s.classList.remove('active');});
  el.classList.add('active');
  setColor(el.dataset.c);
  render();
}
function pickColor(c){
  document.querySelectorAll('.sw').forEach(function(s){s.classList.remove('active');});
  setColor(c);
  render();
}
function onHex(v){
  var h=v.trim();
  if(!h.startsWith('#')) h='#'+h;
  document.getElementById('hexPreview').style.background=h;
  if(/^#[0-9a-fA-F]{6}$/.test(h)){
    document.querySelectorAll('.sw').forEach(function(s){s.classList.remove('active');});
    color=h;
    document.getElementById('colorPicker').value=h;
    render();
  }
}

var hS=document.getElementById('hS');
var hE=document.getElementById('hE');
var cWrap=document.getElementById('cWrap');

hS.addEventListener('mousedown',function(e){active='s';e.preventDefault();});
hS.addEventListener('touchstart',function(e){active='s';e.preventDefault();},{passive:false});
hE.addEventListener('mousedown',function(e){active='e';e.preventDefault();});
hE.addEventListener('touchstart',function(e){active='e';e.preventDefault();},{passive:false});
document.addEventListener('mouseup',function(){active=null;});
document.addEventListener('touchend',function(){active=null;});
document.addEventListener('mousemove',move);
document.addEventListener('touchmove',move,{passive:false});

function move(e){
  if(!active) return;
  e.preventDefault();
  var rect=cWrap.getBoundingClientRect();
  var cy=e.touches?e.touches[0].clientY:e.clientY;
  var p=Math.max(0.01,Math.min(0.99,(cy-rect.top)/rect.height));
  if(active==='s'){sP=Math.min(p,eP-0.03);hS.style.top=(sP*100)+'%';}
  else{eP=Math.max(p,sP+0.03);hE.style.top=(eP*100)+'%';}
  render();
}

function hexRgb(h){return{r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)};}

function applyFade(ctx,w,h){
  var rgb=hexRgb(color);
  var op=parseInt(document.getElementById('opSlider').value)/100;
  var y0=sP*h, y1=eP*h;

  // Canvas 1: imagen original
  var imgCanvas=document.createElement('canvas');
  imgCanvas.width=w; imgCanvas.height=h;
  var ic=imgCanvas.getContext('2d');
  ic.drawImage(img,0,0);

  // Canvas 2: máscara de alpha — reduce alpha del jugador en zona de fade
  var maskCanvas=document.createElement('canvas');
  maskCanvas.width=w; maskCanvas.height=h;
  var mc=maskCanvas.getContext('2d');
  mc.drawImage(img,0,0);

  // Aplicar gradiente de alpha: arriba del fade intacto, abajo transparente
  var ag=mc.createLinearGradient(0,y0,0,y1);
  for(var i=0;i<=30;i++){
    var t=i/30;
    var fade=t*t*(3-2*t)*op;
    var keep=(1-fade);
    ag.addColorStop(t,'rgba(0,0,0,'+Math.max(0,Math.min(1,keep)).toFixed(4)+')');
  }
  mc.globalCompositeOperation='destination-in';
  mc.fillStyle='rgba(0,0,0,1)';
  mc.fillRect(0,0,w,y0);  // arriba: sin cambio
  mc.fillStyle=ag;
  mc.fillRect(0,y0,w,h-y0); // zona fade: reduce alpha

  // Canvas 3: color de fondo del fade (solo en zona de fade)
  var bgCanvas=document.createElement('canvas');
  bgCanvas.width=w; bgCanvas.height=h;
  var bc=bgCanvas.getContext('2d');
  var cg=bc.createLinearGradient(0,y0,0,y1);
  for(var j=0;j<=30;j++){
    var t2=j/30;
    var a=t2*t2*(3-2*t2)*op;
    cg.addColorStop(t2,'rgba('+rgb.r+','+rgb.g+','+rgb.b+','+a.toFixed(4)+')');
  }
  bc.fillStyle=cg;
  bc.fillRect(0,y0,w,h-y0);

  // Componer: primero color, luego jugador con alpha reducida encima
  ctx.clearRect(0,0,w,h);
  ctx.globalCompositeOperation='source-over';
  ctx.drawImage(bgCanvas,0,0);   // color del fade
  ctx.drawImage(maskCanvas,0,0); // jugador con fade aplicado
}

function render(){
  if(!img) return;
  var cv=document.getElementById('cv');
  cv.width=img.naturalWidth; cv.height=img.naturalHeight;
  var ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  applyFade(ctx,cv.width,cv.height);
}

function dl(){
  if(!img) return;
  var off=document.createElement('canvas');
  off.width=img.naturalWidth; off.height=img.naturalHeight;
  var ctx=off.getContext('2d');
  ctx.clearRect(0,0,off.width,off.height);
  applyFade(ctx,off.width,off.height);
  off.toBlob(function(blob){
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download='jgm_fade.png'; a.click();
    URL.revokeObjectURL(url);
    var t=document.getElementById('toast');
    t.classList.add('show');
    setTimeout(function(){t.classList.remove('show');},2000);
  },'image/png');
}
</script>
</body>
</html>    <div class="drag-handle" id="hS" style="top:60%">
      <div class="hline"></div>
      <div class="hpill">↕ inicio fade</div>
    </div>
    <div class="drag-handle" id="hE" style="top:85%">
      <div class="hline"></div>
      <div class="hpill">↕ fin fade</div>
    </div>
  </div>
  <div class="legend">
    <div class="li"><div class="ld" style="background:var(--accent)"></div>morado = inicio</div>
    <div class="li"><div class="ld" style="background:#16a34a"></div>verde = fin (opaco)</div>
  </div>
  <button class="dl-btn" onclick="dl()">⬇ Descargar PNG</button>
</div>

<div class="toast" id="toast">Descargado!</div>

function hexRgb(h){return{r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)};}

function applyFade(ctx,w,h){
  var rgb=hexRgb(color);

  var y0=sP*h, y1=eP*h;

  // Simple gradient overlay from start to bottom
  var g=ctx.createLinearGradient(0,y0,0,y1);

}

function render(){

  var ctx=cv.getContext('2d');

  applyFade(ctx,cv.width,cv.height);
}

  if(!img) return;

  var ctx=off.getContext('2d');

  off.toBlob(function(blob){

    var a=document.createElement('a');

    var t=document.getElementById('toast');
    t.classList.add('show');

</script>
