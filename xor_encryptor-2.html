<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JGM XOR Encryptor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a40;
    --accent: #7b5cf0;
    --accent2: #a78bfa;
    --green: #4ade80;
    --text: #e2e8f0;
    --muted: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 20px 16px 40px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
    padding-top: 8px;
  }

  header h1 {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent2), #c4b5fd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
  }

  header p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    font-family: 'Space Mono', monospace;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent2);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  input[type="text"], input[type="number"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  input:focus {
    border-color: var(--accent);
  }

  .row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }

  .row .col { flex: 1; }
  .row .col-small { flex: 0 0 100px; }

  button {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: opacity 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  button:active { opacity: 0.85; transform: scale(0.98); }

  .result-section { display: none; }
  .result-section.visible { display: block; }

  .result-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
    margin-top: 16px;
  }

  .result-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--green);
    word-break: break-all;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .verify-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    color: var(--accent2);
  }

  .copy-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    color: var(--accent2);
    font-size: 13px;
    font-weight: 700;
    margin-top: 8px;
    width: 100%;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 16px 0;
  }

  .tag {
    display: inline-block;
    background: rgba(123, 92, 240, 0.15);
    color: var(--accent2);
    border: 1px solid rgba(123, 92, 240, 0.3);
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--green);
    color: #0a0a0f;
    padding: 12px 24px;
    border-radius: 100px;
    font-weight: 700;
    font-size: 14px;
    transition: transform 0.3s ease;
    z-index: 999;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>JGM XOR Encryptor</h1>
  <p>c4/c.smali alias tool</p>
</header>

<div class="card">
  <div class="row">
    <div class="col">
      <label>Texto a encriptar</label>
      <input type="text" id="inputText" placeholder="ej: MSN PACK" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="col-small">
      <label>Clave XOR</label>
      <input type="number" id="xorKey" value="42" min="1" max="255">
    </div>
  </div>
  <button onclick="encrypt()">Encriptar</button>
</div>

<div class="card result-section" id="resultCard">
  <div class="tag">resultado</div>

  <div class="result-label">String encriptado</div>
  <div class="result-box" id="encryptedStr"></div>

  <div class="divider"></div>

  <div class="result-label">Código smali completo</div>
  <div class="result-box" id="smaliCode"></div>
  <button class="copy-btn" onclick="copySmali()">Copiar código smali</button>

  <div class="divider"></div>

  <div class="result-label">Verificación</div>
  <div class="verify-box" id="verifyStr"></div>
</div>

<div class="toast" id="toast">Copiado!</div>

<script>
function encrypt() {
  const text = document.getElementById('inputText').value.trim();
  const key = parseInt(document.getElementById('xorKey').value) || 42;
  if (!text) return;

  let encryptedChars = '';
  for (let i = 0; i < text.length; i++) {
    const code = text.charCodeAt(i) ^ key;
    if (code < 32 || code > 126) {
      encryptedChars += '\\u' + code.toString(16).padStart(4, '0');
    } else if (code === 34) {
      encryptedChars += '\\"';
    } else if (code === 92) {
      encryptedChars += '\\\\';
    } else {
      encryptedChars += String.fromCharCode(code);
    }
  }

  const keyHex = '0x' + key.toString(16);
  const smali = `    const-string v0, "ALIAS"\n    const-string v1, "${encryptedChars}"\n    const/16 v2, ${keyHex}\n    invoke-static {v1, v2}, Lc4/c;->c(Ljava/lang/String;I)Ljava/lang/String;\n    move-result-object v1\n    invoke-virtual {p0, v0, v1}, Ljava/lang/String;->replace(Ljava/lang/CharSequence;Ljava/lang/CharSequence;)Ljava/lang/String;\n    move-result-object p0`;

  let verify = '';
  for (let i = 0; i < text.length; i++) {
    verify += String.fromCharCode(text.charCodeAt(i) ^ key ^ key);
  }

  document.getElementById('encryptedStr').textContent = '"' + encryptedChars + '"';
  document.getElementById('smaliCode').textContent = smali;
  document.getElementById('verifyStr').textContent = verify + ' ✓';
  document.getElementById('resultCard').classList.add('visible');
}

function copySmali() {
  const text = document.getElementById('smaliCode').textContent;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(showToast).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  showToast();
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

document.getElementById('inputText').addEventListener('keydown', e => {
  if (e.key === 'Enter') encrypt();
});
</script>
</body>
</html>
