name: Mover y Renombrar Renders Avanzado

on:
  workflow_dispatch:

jobs:
  move-and-rename:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear carpeta faces si no existe
        run: mkdir -p faces

      - name: Mover archivos desde subcarpetas a faces
        run: |
          # Mueve contenido de normalFaces23 si la carpeta existe
          if [ -d "normalFaces23" ]; then
            mv -f normalFaces23/*.png faces/ || echo "No hay pngs en normalFaces23"
            rmdir normalFaces23 || echo "normalFaces23 no está vacía"
          fi
          
          # Mueve contenido de specialFaces o specialFaces23 si existen
          if [ -d "specialFaces" ]; then
            mv -f specialFaces/*.png faces/ || echo "No hay pngs en specialFaces"
            rmdir specialFaces || echo "specialFaces no está vacía"
          fi
          if [ -d "specialFaces23" ]; then
            mv -f specialFaces23/*.png faces/ || echo "No hay pngs en specialFaces23"
            rmdir specialFaces23 || echo "specialFaces23 no está vacía"
          fi

      - name: Renombrar archivos numericos en faces
        run: |
          cd faces
          # Buscamos todos los archivos .png dentro de la carpeta faces
          for file in *.png; do
            # Si el archivo existe y NO empieza con "render_"
            if [ -f "$file" ] && [[ ! "$file" =~ ^render_ ]]; then
              echo "Procesando archivo sin prefijo: $file"
              mv "$file" "render_id$file"
            fi
          done

      - name: Confirmar y guardar todos los cambios
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add faces/
          git add -A
          git commit -m "Automatizacion completa: unificar carpetas y renombrar a render_id" || echo "Sin cambios"
          git push
