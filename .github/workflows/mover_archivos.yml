name: Mover Renders Automaticamente

on:
  workflow_dispatch:

jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear carpeta faces si no existe
        run: mkdir -p faces

      - name: Arreglar archivo con nombre roto
        run: |
          if [ -f facesrender_99021.png ]; then
            mv facesrender_99021.png faces/render_99021.png
          fi

      - name: Vaciar la carpeta con nombre incorrecto
        run: |
          # Si existe la carpeta incorrecta, pasa todo su contenido a "faces" y luego la borra
          if [ -d "jgmfut-assets/faces" ]; then
            mv -f jgmfut-assets/faces/* faces/ || echo "Carpeta vieja vacía"
            rm -rf jgmfut-assets/faces
            
            # Si la carpeta contenedora "jgmfut-assets" queda vacía, también la borra
            rmdir jgmfut-assets || echo "jgmfut-assets contiene otros archivos, se mantiene"
          fi

      - name: Mover cualquier render restante de la raiz
        run: |
          mv -f render_* faces/ || echo "No hay más imágenes en la raíz"

      - name: Confirmar y guardar todos los cambios
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add faces/
          git add -A
          git commit -m "Corregir estructura: eliminar jgmfut-assets/faces y dejar solo faces" || echo "Sin cambios"
          git push
