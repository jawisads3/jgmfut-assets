<div>
  <h2 class="sr-only">Conversor simple de JSON de jugador a bloque smali</h2>

  <div style="margin-bottom: 1rem;">
    <label style="font-size: 13px; color: var(--color-text-secondary); display: block; margin-bottom: 6px;">JSON del jugador (ya limpio, sin campos ofuscados)</label>
    <textarea id="jsonInput" rows="6" style="width: 100%; font-family: var(--font-mono); font-size: 13px; padding: 10px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-tertiary); background: var(--color-background-primary); color: var(--color-text-primary); resize: vertical;" placeholder='{"PHY":100,"PAS":100,"DEF":100,"color":"toty","rating":100,"nationId":38,"clubId":112658,"control":100,"baseId":6044,"url":"http","itemId":0,"packable":1,"PAC":100,"defense":100,"leagueId":2118,"attack":100,"totwNumber":-1,"name":"MBAPPE","DRI":100,"SHO":100,"position":"ST","id":"idGreat20"}'></textarea>
  </div>

  <button id="convertBtn" style="width: 100%; margin-bottom: 1.5rem;"><i class="ti ti-arrow-right" aria-hidden="true" style="margin-right:6px;"></i>Convertir a smali</button>

  <div id="errorBox" style="display:none; background: var(--color-background-danger); color: var(--color-text-danger); padding: 10px 14px; border-radius: var(--border-radius-md); font-size: 13px; margin-bottom: 1rem;"></div>

  <div id="resultBox" style="display:none;">
    <div style="display:flex; align-items:center; justify-content: space-between; margin-bottom: 8px;">
      <span style="font-size: 13px; color: var(--color-text-secondary);">Smali generado (bloque completo)</span>
      <button id="copyBtn" style="padding: 4px 12px; font-size: 12px;"><i class="ti ti-copy" aria-hidden="true" style="margin-right:4px;"></i>Copiar</button>
    </div>
    <pre id="smaliOutput" style="background: var(--color-background-secondary); padding: 14px; border-radius: var(--border-radius-md); font-family: var(--font-mono); font-size: 12px; line-height: 1.5; overflow-x: auto; white-space: pre; margin: 0;"></pre>
  </div>
</div>

<script>
function repairJson(raw) {
  let s = raw.trim();
  s = s.replace(/\\"/g, '"');
  s = s.replace(/^\[|\]$/g, '');
  s = s.replace(/,\s*$/, '');
  const firstBrace = s.indexOf('{');
  const lastBrace = s.lastIndexOf('}');
  if (firstBrace !== -1 && lastBrace !== -1) {
    s = s.substring(firstBrace, lastBrace + 1);
  }
  return s;
}

function toHex(num) {
  num = Math.trunc(Number(num) || 0);
  if (num < 0) {
    return '-0x' + Math.abs(num).toString(16);
  }
  return '0x' + num.toString(16);
}

function escapeSmaliString(s) {
  return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
}

function buildSmaliBlock(p) {
  const lines = [];
  lines.push('    new-instance v1, Lnb/a;');
  lines.push('');
  lines.push('    const-string v2, "' + escapeSmaliString(p.name) + '"');
  lines.push('');
  lines.push('    const-string v3, "' + escapeSmaliString(p.id) + '"');
  lines.push('');
  lines.push('    const v4, ' + toHex(p.baseId));
  lines.push('');
  lines.push('    const/16 v5, ' + toHex(p.rating));
  lines.push('');
  lines.push('    const-string v6, "' + escapeSmaliString(p.position) + '"');
  lines.push('');
  lines.push('    const-string v7, "' + escapeSmaliString(p.position) + '"');
  lines.push('');
  lines.push('    const-string v8, "' + escapeSmaliString(p.color) + '"');
  lines.push('');
  lines.push('    const/16 v9, ' + toHex(p.clubId));
  lines.push('');
  lines.push('    const/16 v10, ' + toHex(p.leagueId));
  lines.push('');
  lines.push('    const/16 v11, ' + toHex(p.nationId));
  lines.push('');
  lines.push('    const-string v12, "' + escapeSmaliString(p.url) + '"');
  lines.push('');
  lines.push('    const/4 v13, -0x1');
  lines.push('');
  lines.push('    const/4 v14, 0x1');
  lines.push('');
  lines.push('    const/4 v15, 0x0');
  lines.push('');
  const stats = [p.PAC, p.SHO, p.PAS, p.DRI, p.DEF, p.PHY, p.attack, p.control, p.defense];
  const regNames = ['v16','v17','v18','v19','v20','v21','v22','v23','v24'];
  for (let i = 0; i < stats.length; i++) {
    lines.push('    const/16 ' + regNames[i] + ', ' + toHex(stats[i]));
    lines.push('');
  }
  lines.push('    const/16 v25, 0x0');
  lines.push('');
  lines.push('    const/16 v26, 0x0');
  lines.push('');
  lines.push('    invoke-direct/range {v1 .. v26}, Lnb/a;-><init>(Ljava/lang/String;Ljava/lang/String;IILjava/lang/String;Ljava/lang/String;Ljava/lang/String;IIILjava/lang/String;IIIIIIIIIIIIII)V');
  lines.push('');
  lines.push('    invoke-virtual {v0, v1}, Ljava/util/ArrayList;->add(Ljava/lang/Object;)Z');
  return lines.join('\n');
}

document.getElementById('convertBtn').addEventListener('click', () => {
  const errorBox = document.getElementById('errorBox');
  const resultBox = document.getElementById('resultBox');
  errorBox.style.display = 'none';
  resultBox.style.display = 'none';

  const raw = document.getElementById('jsonInput').value;
  if (!raw.trim()) {
    errorBox.textContent = 'Pega un JSON primero.';
    errorBox.style.display = 'block';
    return;
  }

  let parsed;
  try {
    const repaired = repairJson(raw);
    parsed = JSON.parse(repaired);
  } catch (e) {
    errorBox.textContent = 'No se pudo parsear el JSON: ' + e.message;
    errorBox.style.display = 'block';
    return;
  }

  const player = {
    name: parsed.name || 'CUSTOM',
    id: parsed.id || ('id' + Math.floor(Math.random()*900000000+100000000)),
    baseId: parsed.baseId || 0,
    rating: parsed.rating || 0,
    position: parsed.position || 'CAM',
    color: parsed.color || 'toty',
    clubId: parsed.clubId || 0,
    leagueId: parsed.leagueId || 0,
    nationId: parsed.nationId || 0,
    url: parsed.url || 'http',
    PAC: parsed.PAC || 0,
    SHO: parsed.SHO || 0,
    PAS: parsed.PAS || 0,
    DRI: parsed.DRI || 0,
    DEF: parsed.DEF || 0,
    PHY: parsed.PHY || 0,
    attack: parsed.attack || 0,
    control: parsed.control || 0,
    defense: parsed.defense || 0
  };

  const smali = buildSmaliBlock(player);
  document.getElementById('smaliOutput').textContent = smali;
  resultBox.style.display = 'block';
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const text = document.getElementById('smaliOutput').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    const original = btn.innerHTML;
    btn.innerHTML = '<i class="ti ti-check" aria-hidden="true" style="margin-right:4px;"></i>Copiado';
    setTimeout(() => { btn.innerHTML = original; }, 1500);
  });
});
</script>
