
<h2 class="sr-only">Generador de texto aleatorio con longitud y caracteres personalizables</h2>
<style>
  .card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem; margin-bottom: 1rem; }
  .label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 6px; display: block; font-weight: 500; }
  .checkbox-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; }
  .cb-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--color-text-primary); cursor: pointer; }
  .cb-item input { cursor: pointer; }
  .result-box { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 1rem; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-primary); word-break: break-all; min-height: 60px; line-height: 1.6; margin-top: 8px; }
  .row { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 1rem; }
  .col { flex: 1; }
  .len-val { font-size: 13px; font-weight: 500; min-width: 36px; text-align: right; color: var(--color-text-primary); }
  .stats { font-size: 12px; color: var(--color-text-secondary); margin-top: 6px; }
  .toast { background: var(--color-background-success); color: var(--color-text-success); font-size: 12px; padding: 4px 12px; border-radius: var(--border-radius-md); display: inline-block; margin-top: 6px; opacity: 0; transition: opacity 0.3s; }
  .toast.show { opacity: 1; }
</style>

<div class="card">
  <span class="label">Caracteres a incluir</span>
  <div class="checkbox-row">
    <label class="cb-item"><input type="checkbox" id="cb_upper" checked> Mayúsculas (A-Z)</label>
    <label class="cb-item"><input type="checkbox" id="cb_lower" checked> Minúsculas (a-z)</label>
    <label class="cb-item"><input type="checkbox" id="cb_nums" checked> Números (0-9)</label>
    <label class="cb-item"><input type="checkbox" id="cb_sym"> Símbolos (!@#$...)</label>
    <label class="cb-item"><input type="checkbox" id="cb_space"> Espacios</label>
  </div>

  <span class="label">Caracteres personalizados (opcional)</span>
  <input type="text" id="custom_chars" placeholder="ej: ABC123!@#" style="width:100%; margin-bottom:1rem;">

  <div class="row">
    <div class="col">
      <span class="label">Longitud: <span id="len_val">32</span></span>
      <input type="range" id="len_slider" min="1" max="1000" value="32" step="1" style="width:100%;">
    </div>
    <div>
      <span class="label">Exacta</span>
      <input type="number" id="len_input" value="32" min="1" max="1000" step="1" style="width:80px;">
    </div>
  </div>

  <button onclick="generate()" style="width:100%;">Generar <i class="ti ti-refresh" aria-hidden="true"></i></button>
</div>

<div class="card">
  <span class="label">Resultado</span>
  <div class="result-box" id="result">—</div>
  <div class="stats" id="stats"></div>
  <button onclick="copyResult()" style="margin-top:8px; width:100%;"><i class="ti ti-copy" aria-hidden="true"></i> Copiar</button>
  <div class="toast" id="toast">Copiado!</div>
</div>

<script>
const UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const LOWER = 'abcdefghijklmnopqrstuvwxyz';
const NUMS  = '0123456789';
const SYMS  = '!@#$%^&*()-_=+[]{}|;:,.<>?/~`"\'\\';

const slider = document.getElementById('len_slider');
const numInput = document.getElementById('len_input');
const lenVal = document.getElementById('len_val');

slider.addEventListener('input', () => {
  numInput.value = slider.value;
  lenVal.textContent = slider.value;
});

numInput.addEventListener('input', () => {
  let v = Math.min(1000, Math.max(1, parseInt(numInput.value) || 1));
  numInput.value = v;
  slider.value = v;
  lenVal.textContent = v;
});

function generate() {
  let charset = '';
  if (document.getElementById('cb_upper').checked) charset += UPPER;
  if (document.getElementById('cb_lower').checked) charset += LOWER;
  if (document.getElementById('cb_nums').checked)  charset += NUMS;
  if (document.getElementById('cb_sym').checked)   charset += SYMS;
  if (document.getElementById('cb_space').checked) charset += ' ';
  const custom = document.getElementById('custom_chars').value;
  if (custom) charset += custom;

  if (!charset) { document.getElementById('result').textContent = 'Selecciona al menos un tipo de caracter.'; return; }

  const len = parseInt(slider.value);
  let result = '';
  for (let i = 0; i < len; i++) {
    result += charset[Math.floor(Math.random() * charset.length)];
  }

  document.getElementById('result').textContent = result;
  document.getElementById('stats').textContent = `${len} caracteres · ${charset.length} posibles`;
}

function copyResult() {
  const text = document.getElementById('result').textContent;
  if (text === '—') return;
  navigator.clipboard.writeText(text).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

generate();
</script>
