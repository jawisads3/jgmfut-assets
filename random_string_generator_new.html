<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JGM String Generator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a40;
    --accent: #7b5cf0;
    --accent2: #a78bfa;
    --green: #4ade80;
    --text: #e2e8f0;
    --muted: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 20px 16px 40px;
  }

  header { text-align: center; margin-bottom: 28px; padding-top: 8px; }

  header h1 {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent2), #c4b5fd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
  }

  header p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    font-family: 'Space Mono', monospace;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent2);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: block;
  }

  input[type="text"], input[type="number"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  input:focus { border-color: var(--accent); }

  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    margin: 8px 0;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
  }

  .checkbox-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }

  .cb-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    transition: border-color 0.2s;
    user-select: none;
  }

  .cb-item:hover { border-color: var(--accent); }
  .cb-item.active { border-color: var(--accent); background: rgba(123,92,240,0.1); }

  .cb-item input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }

  .cb-item span {
    font-size: 12px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    line-height: 1.3;
  }

  .cb-item .preview {
    font-size: 10px;
    color: var(--muted);
    display: block;
    margin-top: 2px;
  }

  .special-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }

  .sp-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    color: var(--accent2);
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    width: auto;
    min-width: 36px;
    text-align: center;
  }

  .sp-btn:hover { border-color: var(--accent); background: rgba(123,92,240,0.15); }
  .sp-btn.selected { border-color: var(--accent); background: rgba(123,92,240,0.25); color: white; }

  .len-display {
    font-family: 'Space Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    color: var(--accent2);
    text-align: center;
    margin-bottom: 4px;
  }

  button.gen-btn {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: opacity 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  button.gen-btn:active { opacity: 0.85; transform: scale(0.98); }

  .result-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--green);
    word-break: break-all;
    line-height: 1.7;
    min-height: 80px;
    margin-top: 8px;
  }

  .stats {
    font-size: 12px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    margin-top: 8px;
  }

  .copy-btn {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    color: var(--accent2);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    margin-top: 10px;
    cursor: pointer;
    transition: border-color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .copy-btn:hover { border-color: var(--accent); }

  .divider { height: 1px; background: var(--border); margin: 16px 0; }

  .tag {
    display: inline-block;
    background: rgba(123, 92, 240, 0.15);
    color: var(--accent2);
    border: 1px solid rgba(123, 92, 240, 0.3);
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
    font-family: 'Space Mono', monospace;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--green);
    color: #0a0a0f;
    padding: 12px 24px;
    border-radius: 100px;
    font-weight: 700;
    font-size: 14px;
    font-family: 'Syne', sans-serif;
    transition: transform 0.3s ease;
    z-index: 999;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>JGM String Generator</h1>
  <p>generador de texto aleatorio</p>
</header>

<div class="card">
  <span class="section-label">Caracteres a incluir</span>
  <div class="checkbox-grid">
    <label class="cb-item" id="lbl_upper">
      <input type="checkbox" id="cb_upper" checked>
      <span>A-Z mayúsculas<span class="preview">ABCDEFGHIJ...</span></span>
    </label>
    <label class="cb-item" id="lbl_lower">
      <input type="checkbox" id="cb_lower" checked>
      <span>a-z minúsculas<span class="preview">abcdefghij...</span></span>
    </label>
    <label class="cb-item" id="lbl_nums">
      <input type="checkbox" id="cb_nums" checked>
      <span>0-9 números<span class="preview">0123456789</span></span>
    </label>
    <label class="cb-item" id="lbl_sym">
      <input type="checkbox" id="cb_sym">
      <span>símbolos teclado<span class="preview">!@#$%^&amp;*...</span></span>
    </label>
    <label class="cb-item" id="lbl_space">
      <input type="checkbox" id="cb_space">
      <span>espacios<span class="preview">[ ]</span></span>
    </label>
    <label class="cb-item" id="lbl_special">
      <input type="checkbox" id="cb_special">
      <span>especiales unicode<span class="preview">§±°©®™...</span></span>
    </label>
    <label class="cb-item" id="lbl_math">
      <input type="checkbox" id="cb_math">
      <span>matemáticos<span class="preview">∑∞√∫≠≈...</span></span>
    </label>
    <label class="cb-item" id="lbl_arrows">
      <input type="checkbox" id="cb_arrows">
      <span>flechas &amp; formas<span class="preview">→↑←↓◆▲●...</span></span>
    </label>
  </div>

  <span class="section-label">Símbolos especiales — clic para agregar al pool</span>
  <div class="special-grid" id="special_grid"></div>

  <div class="divider"></div>

  <span class="section-label">Caracteres personalizados</span>
  <input type="text" id="custom_chars" placeholder="escribe o pega cualquier caracter aquí" style="margin-bottom: 16px;">

  <div class="divider"></div>

  <div class="len-display" id="len_display">32</div>
  <span class="section-label" style="text-align:center; display:block;">Longitud (1 – 1000)</span>
  <input type="range" id="len_slider" min="1" max="1000" value="32" step="1">

  <div style="margin-top:12px; margin-bottom:16px;">
    <span class="section-label">Valor exacto</span>
    <input type="number" id="len_input" value="32" min="1" max="1000" step="1">
  </div>

  <button class="gen-btn" onclick="generate()">Generar</button>
</div>

<div class="card" id="result_card" style="display:none;">
  <div class="tag">resultado</div>
  <span class="section-label">Texto generado</span>
  <div class="result-box" id="result"></div>
  <div class="stats" id="stats"></div>
  <button class="copy-btn" onclick="copyResult()">Copiar texto</button>
</div>

<div class="toast" id="toast">Copiado!</div>

<script>
const UPPER   = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const LOWER   = 'abcdefghijklmnopqrstuvwxyz';
const NUMS    = '0123456789';
const SYMS    = '!@#$%^&*()-_=+[]{}|;:,.<>?/~`"\'\\'  ;
const SPECIAL = '§±°©®™€£¥¢¿¡µ¶†‡•…«»‹›''""„‚—–';
const MATH    = '∑∞√∫∂∆∇∏∐∀∃∄∈∉∋∌∩∪⊂⊃⊆⊇⊕⊗⊥∥≠≈≡≤≥≪≫∓±×÷';
const ARROWS  = '→←↑↓↔↕↗↘↙↖⇒⇐⇑⇓⇔◆◇▲△▼▽●○■□★☆♠♣♥♦';

const SPECIAL_CHARS = [
  '§','±','°','©','®','™','€','£','¥','¢','¿','¡','µ','¶',
  '†','‡','•','…','«','»','—','–','∑','∞','√','∫','∆','∇',
  '≠','≈','≡','≤','≥','∈','∉','∩','∪','⊂','⊃','⊕','⊗',
  '→','←','↑','↓','↔','⇒','⇐','◆','▲','▼','●','○','■','□',
  '★','☆','♠','♣','♥','♦','α','β','γ','δ','ε','ζ','η','θ',
  'ι','κ','λ','μ','ν','ξ','π','ρ','σ','τ','υ','φ','χ','ψ','ω',
  'Α','Β','Γ','Δ','Ε','Ζ','Η','Θ','Ι','Κ','Λ','Μ','Ν','Ξ','Π',
  'Ρ','Σ','Τ','Υ','Φ','Χ','Ψ','Ω','½','⅓','⅔','¼','¾','⅛','⅜',
  '⅝','⅞','№','℃','℉','Ω','℃','∂','∏','∐','∀','∃','∄',
  '⌀','⌂','⌘','⌛','⌚','✓','✗','✘','✦','✧','✩','✪','✫','✬',
  '❤','❥','❦','❧','☀','☁','☂','☃','☄','☮','☯','☺','☻','♪','♫'
];

const selectedSpecials = new Set();

const grid = document.getElementById('special_grid');
SPECIAL_CHARS.forEach(ch => {
  const btn = document.createElement('button');
  btn.className = 'sp-btn';
  btn.textContent = ch;
  btn.title = `U+${ch.codePointAt(0).toString(16).toUpperCase().padStart(4,'0')}`;
  btn.addEventListener('click', () => {
    if (selectedSpecials.has(ch)) {
      selectedSpecials.delete(ch);
      btn.classList.remove('selected');
    } else {
      selectedSpecials.add(ch);
      btn.classList.add('selected');
    }
  });
  grid.appendChild(btn);
});

const slider   = document.getElementById('len_slider');
const numInput = document.getElementById('len_input');
const display  = document.getElementById('len_display');

slider.addEventListener('input', () => {
  numInput.value = slider.value;
  display.textContent = slider.value;
});

numInput.addEventListener('input', () => {
  let v = Math.min(1000, Math.max(1, parseInt(numInput.value) || 1));
  numInput.value = v;
  slider.value = v;
  display.textContent = v;
});

function generate() {
  let charset = '';
  if (document.getElementById('cb_upper').checked)   charset += UPPER;
  if (document.getElementById('cb_lower').checked)   charset += LOWER;
  if (document.getElementById('cb_nums').checked)    charset += NUMS;
  if (document.getElementById('cb_sym').checked)     charset += SYMS;
  if (document.getElementById('cb_space').checked)   charset += ' ';
  if (document.getElementById('cb_special').checked) charset += SPECIAL;
  if (document.getElementById('cb_math').checked)    charset += MATH;
  if (document.getElementById('cb_arrows').checked)  charset += ARROWS;
  charset += [...selectedSpecials].join('');
  const custom = document.getElementById('custom_chars').value;
  if (custom) charset += custom;

  const unique = [...new Set(charset)].join('');

  if (!unique) {
    document.getElementById('result_card').style.display = 'block';
    document.getElementById('result').textContent = 'Selecciona al menos un tipo de caracter.';
    return;
  }

  const len = parseInt(slider.value);
  let result = '';
  for (let i = 0; i < len; i++) {
    result += unique[Math.floor(Math.random() * unique.length)];
  }

  document.getElementById('result').textContent = result;
  document.getElementById('stats').textContent = `${len} caracteres · pool: ${unique.length} posibles`;
  document.getElementById('result_card').style.display = 'block';
}

function copyResult() {
  const text = document.getElementById('result').textContent;
  if (!text) return;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(showToast).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  showToast();
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
</html>
